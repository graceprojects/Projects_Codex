<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4EFE8">
  <title>3D-карта района — HAVEN</title>
  <meta name="description" content="Интерактивная 3D-карта района HAVEN: город, достопримечательности, время суток и сезоны.">
  
  
  
  <link rel="stylesheet" href="fonts.css?v=haven-1">
  <link rel="stylesheet" href="styles.css?v=haven-1">
  <link rel="stylesheet" href="haven.css?v=3">
  <link rel="icon" type="image/svg+xml" href="assets/brand/haven-symbol.svg">
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body class="m3-page">
  <header class="m3-topbar">
    <a class="brand" href="index.html" aria-label="HAVEN — на главную"><img class="haven-logo" src="assets/brand/haven-logo.svg" alt="HAVEN — Halovat makoni" width="150" height="100"></a>
    <span class="m3-topbar-title">3D-карта района</span>
    <a class="m3-back" href="index.html#location"><span aria-hidden="true">←</span> Вернуться на сайт</a>
  </header>
  <main>
    <h1 class="visually-hidden">3D-карта района HAVEN</h1>
    <div class="map3d" id="map3d" data-base="assets/map/" data-full="1">
          <div class="m3-stage"></div>
          <div class="m3-layer"></div>
          <div class="m3-loading" role="status"><span>Загрузка сцены</span><p><b>0</b>%</p><div class="m3-bar"><i></i></div></div>
          <aside class="m3-list" aria-label="Что рядом">
            <button class="m3-list-toggle" type="button">Что рядом <span>14</span></button>
            <ol></ol>
          </aside>
          <aside class="m3-panel" aria-live="polite">
            <button class="m3-close" type="button" aria-label="Закрыть">×</button>
            <div class="m3-p-num">01</div>
            <p class="m3-p-kicker"></p>
            <h3 class="m3-p-title"></h3>
            <p class="m3-p-cat"></p>
            <p class="m3-p-desc"></p>
            <a class="m3-p-route" target="_blank" rel="noopener">Маршрут в Google Maps ↗</a>
          </aside>
          <div class="m3-tools">
            <button class="m3-compass" type="button" aria-label="Развернуть на север" title="Север"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17"/><path class="n" d="M20 6l4.2 14h-8.4z"/><path class="s" d="M20 34l-4.2-14h8.4z"/><text x="20" y="5.3">N</text></svg></button>
            <button class="m3-mode" type="button" aria-label="День или вечер" title="День / вечер"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg></button>
            <button class="m3-home-btn" type="button" aria-label="Вернуться к комплексу" title="К комплексу"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg></button>
          </div>
          <div class="m3-seasons" role="group" aria-label="Время года">
            <button type="button" data-s="winter" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7M9 4l3 2 3-2M9 20l3-2 3 2"/></svg>Зима</button>
            <button type="button" data-s="spring" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2.4"/><path d="M12 9.6c-1.6-4 1.6-6 0-7.2-1.6 1.2 1.6 3.2 0 7.2zM14.3 11.3c4-1.4 5.6 1.9 7 .3-1.3-1.5-3.1 1.8-7-.3zM13.4 14.2c2.6 3.4-.2 6-.1 7.8 1.9-.3.8-4 .1-7.8zM10.6 14.2c-2.6 3.4.2 6 .1 7.8-1.9-.3-.8-4-.1-7.8zM9.7 11.3c-4-1.4-5.6 1.9-7 .3 1.3-1.5 3.1 1.8 7-.3z"/></svg>Весна</button>
            <button type="button" data-s="summer" aria-pressed="true" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>Лето</button>
            <button type="button" data-s="autumn" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19C5 10 11 4 20 4c0 9-6 15-15 15zM5 19l9-9"/></svg>Осень</button>
            <button type="button" class="m3-precip" aria-pressed="true" hidden><svg class="ico-snow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 15a4 4 0 110-8 5 5 0 019.6-1.6A3.5 3.5 0 1117 15zM8 18.5h.01M12 20h.01M16 18.5h.01"/></svg><svg class="ico-rain" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14a4 4 0 110-8 5 5 0 019.6-1.6A3.5 3.5 0 1117 14zM8 17l-1 3M12 17l-1 3M16 17l-1 3"/></svg><span>Осадки</span></button>
            <button type="button" class="m3-sound on" aria-pressed="true" hidden title="Звук грозы"><svg class="ico-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4zM16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg><svg class="ico-off" viewBox="0 0 24 24" aria-hidden="true" style="display:none"><path d="M4 9h4l5-4v14l-5-4H4zM17 9l5 6M22 9l-5 6"/></svg><span>Звук</span></button>
          </div>
          <div class="m3-time" aria-label="Время суток">
            <button class="m3-play" type="button" aria-label="Проиграть сутки" aria-pressed="false">▶</button>
            <span class="m3-clock"><i>☀</i><b>13:00</b></span>
            <input class="m3-slider" type="range" min="0" max="24" step="0.05" value="13" aria-label="Время суток">
            <div class="m3-presets"><button type="button" data-k="morning">Утро</button><button type="button" data-k="day">День</button><button type="button" data-k="sunset">Закат</button><button type="button" data-k="night">Ночь</button><button type="button" data-k="now">Сейчас</button></div>
          </div>
          <button class="m3-activate" type="button">Исследовать карту</button>
          <button class="m3-exit" type="button" aria-label="Закончить просмотр карты">✕</button>
        </div>
  </main>
  <script type="module" src="map3d.js?v=haven-1"></script>
</body>
</html>
